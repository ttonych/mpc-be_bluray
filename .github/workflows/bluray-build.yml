name: Build Blu-ray candidate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bluray-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up pinned Temurin JDK
        # setup-java rejects the four-part Java version 21.0.12.1+1.
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'temurin-jdk.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'temurin-jdk'
          Invoke-WebRequest -Uri 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1.zip' -OutFile $archive
          $expected = 'f9d6e191ab098c0d416e7d588a24420a8621cd2f4720dab2459b8b7b2d2d8b4e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Temurin JDK checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $javaRoot = Join-Path $destination 'jdk-21.0.12.1+1'
          & (Join-Path $javaRoot 'bin\javac.exe') -version
          if ($LASTEXITCODE) { throw 'Could not run the pinned JDK.' }
          "JAVA_HOME=$javaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $javaRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check publication inputs
        run: python bluray/tools/check-public-tree.py
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            bluray/downloads
            bluray/tools/msys
            bluray/build/vcpkg_installed
          key: bluray-windows2022-${{ hashFiles('bluray/vcpkg.json', 'bluray/versions.json', 'bluray/tools/prepare-dependencies.ps1') }}
      - name: Prepare build dependencies
        run: ./bluray/tools/prepare-dependencies.ps1
      - name: Build libbluray
        run: ./bluray/tools/build-libbluray.ps1 -DependencyRoot "$PWD/bluray/build/vcpkg_installed/x64-windows"
      - name: Build Java components
        run: ./bluray/tools/build-bdj.ps1 -JavaHome $env:JAVA_HOME
      - name: Run component tests
        run: ./bluray/tools/test-components.ps1
      - name: Build player and Russian resources
        run: ./bluray/tools/build-player.ps1
      - name: Package clean candidate
        run: python bluray/tools/package-player.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mpc-be-bluray-candidate-x64
          path: |
            bluray/out/packages/*.zip
            bluray/out/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
